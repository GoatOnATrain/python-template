# Pre-commit hooks for this project.
#
# ruff / mypy / pytest run through `poetry run` (repo: local, language: system)
# so they use the exact versions pinned in pyproject.toml / poetry.lock — one
# source of truth shared with CI, no separate hook versions to bump.
#
# Fast checks gate every commit; pytest runs on push to keep commits snappy.
# Set up both with a single `poetry run pre-commit install`.
---
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: poetry run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
        stages: [pre-commit]

      - id: mypy
        name: mypy
        entry: poetry run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
        stages: [pre-commit]

      - id: test-first-reminder
        name: test-first reminder
        entry: scripts/check-test-first.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: pytest
        name: pytest
        entry: poetry run pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
